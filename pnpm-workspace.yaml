packages:
  - 'apps/*'
  - 'services/*'
  - 'packages/*'
  - 'packages/web/*'
  - 'docs/*'
  - 'internal/*'

allowBuilds:
  esbuild: true
  msw: false
  simple-git-hooks: true

catalogs:
  # 核心依赖
  core:
    # React 生态核心
    react: ^19.3.0
    react-dom: ^19.3.0
    '@tanstack/react-router': ^1.170.39
    '@tanstack/react-query': ^5.104.0
    zustand: ^5.0.15

    # TypeScript 和构建工具
    typescript: ^6.0.3
    vite: ^8.3.1

  # 开发工具
  dev:
    # 代码检查
    oxfmt: ^0.70.0
    oxlint: ^1.85.0
    '@tanstack/eslint-plugin-query': ^5.104.0
    '@tanstack/eslint-plugin-router': ^1.162.0
    oxlint-tsgolint: ^7.0.2003

    # 项目构建
    turbo: ^2.11.4
    tsdown: ^0.23.0
    rimraf: ^6.1.3

    # 测试工具

    # 工程化工具
    '@commitlint/cli': ^21.2.3
    '@commitlint/config-conventional': ^21.2.3
    lint-staged: ^17.6.0
    simple-git-hooks: ^2.14.0

  # Web 前端专用
  web:
    # 类型定义
    '@types/node': ^24.13.3
    '@types/react': ^19.3.0
    '@types/react-dom': ^19.3.0

    # 状态管理
    immer: ^11.1.18

    # 工具库
    '@reactuses/core': ^6.5.9

    # 构建和打包工具
    '@babel/core': ^8.0.6
    '@rolldown/plugin-babel': ^0.2.4

    # Vite 插件
    '@vitejs/plugin-react': ^6.1.1
    babel-plugin-react-compiler: ^1.0.0
    '@tanstack/router-plugin': ^1.168.40
    unplugin-svg-component: ^0.13.0

    # 开发者工具
    '@tanstack/devtools-vite': ^0.8.5
    '@tanstack/react-devtools': ^0.10.13
    '@tanstack/react-router-devtools': ^1.167.2
    '@tanstack/react-query-devtools': ^5.104.0

  # UI 组件库
  ui-shared:
    # UI
    '@base-ui/react': ^1.8.0
    '@fontsource-variable/inter': ^5.3.0
    class-variance-authority: ^0.7.1
    cn: ^0.4.0
    react-top-loading-bar: ^3.0.2
    shadcn: ^4.21.0

    # 图标
    lucide-react: ^1.48.0
    '@iconify/react': ^6.0.2

  # CSS
  css:
    tailwindcss: ^4.3.3
    '@tailwindcss/vite': ^4.3.3
    tw-animate-css: ^1.4.0

  # 国际化
  i18n:
    i18next: 26.4.2
    react-i18next: 17.0.14
    i18next-browser-languagedetector: 8.2.1

  # 共享工具库
  utils:
    # 通用工具
    zod: ^4.6.5
    date-fns: ^4.4.0
    '@date-fns/tz': ^1.5.0
    es-toolkit: ^1.52.0
